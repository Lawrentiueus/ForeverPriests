# Skip the Netlify build when the ONLY file that changed is articles.json
# (articles load straight from GitHub, so the site doesn't need a redeploy).
# Exit 0 = skip, anything else = build. Retries, manual deploys and errors always build.
[build]
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)articles.json' ':(exclude)settings.json'"
